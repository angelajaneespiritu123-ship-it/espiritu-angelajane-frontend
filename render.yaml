services:
  - type: web
    name: kanto-store-api
    runtime: docker
    plan: free
    dockerfilePath: ./LavalustAPI/Dockerfile
    dockerContext: ./LavalustAPI
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: Kanto Store API
      - key: JWT_SECRET
        generateValue: true
      - key: DB_DRIVER
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_CA
        sync: false
      - key: CORS_ALLOWED_ORIGIN
        sync: false